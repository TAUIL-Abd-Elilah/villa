name: Spiral fitting native extension builds

on:
  pull_request:
    paths:
      - 'spiral-fitting/**'
      - '.github/workflows/spiral-fitting-windows.yml'
  push:
    branches: [main]
    paths:
      - 'spiral-fitting/**'
      - '.github/workflows/spiral-fitting-windows.yml'

jobs:
  native-build-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: spiral-fitting
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install native build requirements
        run: |
          python -m pip install `
            "scikit-build-core>=0.10" `
            "nanobind>=2.0" `
            "cmake>=3.22" `
            ninja numpy
      - name: Build native extensions
        run: python -m pip install -e . --no-deps --no-build-isolation
      - name: Test native crossing contention path
        run: >-
          python -m unittest discover -s tests
          -p test_native_track_crossings.py -v
      - name: Verify Windows optional-module contract
        run: >-
          python -c
          "import importlib.util; from vc_spiral import spiral_sampling, track_crossings, surface_index; assert importlib.util.find_spec('vc_spiral.track_store') is None"

  native-contention-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: spiral-fitting
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install native build requirements
        run: |
          python -m pip install \
            "scikit-build-core>=0.10" \
            "nanobind>=2.0" \
            "cmake>=3.22" \
            ninja numpy
      - name: Build native extensions
        run: python -m pip install -e . --no-deps --no-build-isolation
      - name: Test parallel crossing contention path
        run: >-
          python -m unittest discover -s tests
          -p test_native_track_crossings.py -v
